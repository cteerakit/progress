<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Slide Status Fixture</title>
    <style>
      body {
        margin: 0;
        font-family: "Google Sans", Roboto, Arial, sans-serif;
        background: #f8f9fa;
      }

      .docs-titlebar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        background: #fff;
        border-bottom: 1px solid #dadce0;
      }

      .docs-title-input {
        border: 0;
        font-size: 18px;
        font-weight: 500;
      }

      .layout {
        display: grid;
        grid-template-columns: 180px 1fr;
        min-height: calc(100vh - 57px);
      }

      .punch-filmstrip {
        padding: 12px;
        background: #f1f3f4;
        border-right: 1px solid #dadce0;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      .punch-filmstrip-thumbnail {
        height: 90px;
        border: 2px solid transparent;
        border-radius: 4px;
        background: linear-gradient(135deg, #fff, #e8eaed);
        position: relative;
      }

      .punch-filmstrip-thumbnail[aria-selected="true"] {
        border-color: #1a73e8;
      }

      .canvas {
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="docs-titlebar-container">
      <div class="docs-titlebar">
        <input class="docs-title-input" value="Fixture Deck" readonly />
        <div class="docs-titlebar-buttons"></div>
      </div>
    </div>

    <div class="layout">
      <div class="punch-filmstrip" id="filmstrip">
        <div class="punch-filmstrip-thumbnail" role="option" aria-selected="true"></div>
        <div class="punch-filmstrip-thumbnail" role="option"></div>
        <div class="punch-filmstrip-thumbnail" role="option"></div>
      </div>
      <main class="canvas">
        <p>Local fixture for manual extension verification.</p>
      </main>
    </div>

    <script>
      history.replaceState(null, '', '/presentation/d/fixture-deck-id/edit#slide=id.p1');
    </script>
  </body>
</html>
